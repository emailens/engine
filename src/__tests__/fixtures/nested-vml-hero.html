<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <title>Nested VML hero</title>
  </head>
  <body style="margin:0; padding:0;">
    <!--
      Skeleton reproduction of a VML hero pattern seen in the wild: a v:rect
      background whose v:textbox contains a second VML shape (a v:roundrect
      button). Outlook does not support nesting one shape inside another's
      textbox, so the button escapes the hero's positioning frame.

      Content is deliberately generic. The point of the fixture is the VML
      structure and its attribute values, not the copy around it.
    -->
    <table width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center">
          <table cellspacing="0" cellpadding="0" border="0" style="width:640px;">
            <tr>
              <td
                background="https://example.com/hero.png"
                style="background-image:url('https://example.com/hero.png');"
              >
                <!--[if gte mso 9]>
            <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:640px; height:px; v-text-anchor:middle;">
            <v:fill type="frame" src="https://example.com/hero.png" color="#000000" />
            <v:textbox inset="0,0,0,0">
            <![endif]-->
                <table width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" style="height:400px;">
                      <h1 style="color:#ffffff;">Heading</h1>
                      <p style="color:#ffffff;">Supporting line of body copy.</p>
                      <!--[if mso]>
                      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                      href="https://example.com/" style="width:164px; height:48px; v-text-anchor:middle;"
                      arcsize="120%" stroke="f" fillcolor="#336699">
                      <w:anchorlock/>
                      <center>
                      <![endif]-->
                      <a
                        href="https://example.com/"
                        style="background-color:#336699; border-radius:100px; color:#ffffff; display:inline-block; font-family:Arial, sans-serif; font-size:16px; line-height:20px; padding:14px 32px; text-align:center; text-decoration:none;"
                      >
                        Call to action
                      </a>
                      <!--[if mso]>
                      </center>
                      </v:roundrect>
                      <![endif]-->
                    </td>
                  </tr>
                </table>
                <!--[if gte mso 9]>
            </v:textbox>
            </v:rect>
            <![endif]-->
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <!-- Negative control: a standalone button, correctly formed and not nested. -->
    <table width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="left">
          <!--[if mso]>
          <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
          href="https://example.com/" style="width:164px; height:48px; v-text-anchor:middle;"
          arcsize="50%" stroke="f" fillcolor="#336699">
          <w:anchorlock/>
          <center>
          <![endif]-->
          <a
            href="https://example.com/"
            style="background-color:#336699; border-radius:100px; color:#ffffff; display:inline-block; font-family:Arial, sans-serif; font-size:16px; line-height:20px; padding:14px 32px; text-align:center; text-decoration:none;"
          >
            Call to action
          </a>
          <!--[if mso]>
          </center>
          </v:roundrect>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
