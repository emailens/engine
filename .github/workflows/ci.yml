name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: CI installs what a contributor's checkout does,
      # so a green run means the committed lockfile actually works.
      - run: bun install --frozen-lockfile

      # The design check's tests draw pages in a real browser. Liberation
      # gives Arial a metric-compatible face, as Windows, macOS and our
      # Browserless have; a bare runner fell back to a wider face and read a
      # plain table as changed in Apple Mail (diff 0.028).
      - run: bunx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y fonts-liberation

      - run: bun run typecheck

      - run: bun test

      - run: bun run build
